spring.config.activate.on-profile=dev
server.port=8082

oauth.redirect-base=http://localhost:8082
frontend.base=http://localhost:8081

server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=Lax

# Supabase PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Pooler closes idle sockets; retire connections before Hikari hands out dead ones.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.config.import=optional:classpath:application-dev-secrets.properties

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=TRACE
