spring.application.name=Project03

# Heroku sets SPRING_PROFILES_ACTIVE if you want; default to prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Heroku assigns PORT; Spring Boot must listen on it
server.port=${PORT:8080}

# if you deploy behind proxies (Heroku router), this helps correct scheme/host
server.forward-headers-strategy=framework

# Track B statement worker. Set both in the environment or a local .env file.
sop.worker.base-url=${SOP_WORKER_BASE_URL:}
sop.worker.secret=${SOP_WORKER_SECRET:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
